<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fecfef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc3a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Letra L estilizada -->
  <text x="50" y="72" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">L</text>
  
  <!-- Detalle decorativo -->
  <circle cx="75" cy="25" r="8" fill="white" opacity="0.8"/>
  <circle cx="80" cy="30" r="5" fill="white" opacity="0.6"/>
</svg>
